# Post a context card and a follow-up question for new contributors.
name: Contributor Context with Challenge

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write

jobs:
  context-card:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: dvelton/first-knock@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          challenge-enabled: "true"

  challenge-monitor:
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: dvelton/first-knock@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: challenge-monitor
